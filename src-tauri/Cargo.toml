[package]
name = "margin"
version = "0.1.0"
description = "An active reading environment"
authors = ["Margin contributors"]
edition = "2021"
[lib]
name = "margin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
