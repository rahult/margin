name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend runtime dependencies
        run: npm ci --prefix server

      - name: Prune backend runtime (platform-specific)
        shell: bash
        run: |
          rm -rf server/node_modules/sharp server/node_modules/@img server/node_modules/onnxruntime-web
          case "${{ matrix.platform }}" in
            macos-latest) rm -rf server/node_modules/onnxruntime-node/bin/napi-v3/linux server/node_modules/onnxruntime-node/bin/napi-v3/win32 ;;
            ubuntu-22.04) rm -rf server/node_modules/onnxruntime-node/bin/napi-v3/darwin server/node_modules/onnxruntime-node/bin/napi-v3/win32 ;;
            windows-latest) rm -rf server/node_modules/onnxruntime-node/bin/napi-v3/darwin server/node_modules/onnxruntime-node/bin/napi-v3/linux ;;
          esac

      - name: Stage node sidecar binary
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          NODE_BIN="$(which node || command -v node)"
          case "${{ matrix.platform }}" in
            macos-latest) cp "$NODE_BIN" src-tauri/binaries/node-aarch64-apple-darwin ;;
            ubuntu-22.04) cp "$NODE_BIN" src-tauri/binaries/node-x86_64-unknown-linux-gnu ;;
            windows-latest) cp "$NODE_BIN" src-tauri/binaries/node-x86_64-pc-windows-msvc.exe ;;
          esac

      - name: Build and eval
        run: |
          npm run build
          npm run eval

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Margin ${{ github.ref_name }}"
          releaseDraft: true

      # Stable, unversioned aliases so the site can link
      # releases/latest/download/<name> directly to the current build.
      - name: Publish stable-named download aliases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          mkdir -p /tmp/alias
          case "${{ matrix.platform }}" in
            macos-latest)
              cp src-tauri/target/release/bundle/dmg/*.dmg /tmp/alias/Margin-macOS-aarch64.dmg ;;
            windows-latest)
              cp src-tauri/target/release/bundle/msi/*.msi /tmp/alias/Margin-Windows-x64.msi
              cp src-tauri/target/release/bundle/nsis/*-setup.exe /tmp/alias/Margin-Windows-x64-setup.exe ;;
            ubuntu-22.04)
              cp src-tauri/target/release/bundle/deb/*.deb /tmp/alias/Margin-Linux-amd64.deb
              cp src-tauri/target/release/bundle/rpm/*.rpm /tmp/alias/Margin-Linux-x86_64.rpm ;;
          esac
          gh release upload "${{ github.ref_name }}" /tmp/alias/* --clobber
